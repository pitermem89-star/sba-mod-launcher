name: Build sba-shaders

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/sba-shaders/**'
      - '.github/workflows/build-sba-shaders.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile libsba-shaders.so (arm64)
        run: |
          set -eu
          SRC=$(find examples/sba-shaders -name '*.cpp' | head -n1)
          MODJSON=examples/sba-shaders/mod.json
          if [ -z "$SRC" ]; then
            echo "::error::no .cpp file found in examples/sba-shaders"
            find . -not -path './.git/*' -name '*shaders*'
            exit 1
          fi
          if [ ! -f "$MODJSON" ]; then echo "::error::$MODJSON not found"; exit 1; fi
          HPP=$(find . -name bearite.hpp -not -path './.git/*' | head -n1)
          if [ -z "$HPP" ]; then echo "::error::bearite.hpp not found"; exit 1; fi
          echo "commit: $GITHUB_SHA"
          echo "source: $SRC ($(wc -c < "$SRC") bytes)"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p out/sba-shaders
          "$CXX" -std=c++17 -O2 -shared -fPIC -fvisibility=hidden -static-libstdc++ \
            -Wl,-z,max-page-size=16384 \
            -I "$(dirname "$HPP")" "$SRC" \
            -o out/sba-shaders/libsba-shaders.so -ldl -llog
          nm -D --defined-only out/sba-shaders/libsba-shaders.so | grep -q bearite_on_load || { echo "::error::bearite_on_load is not exported"; exit 1; }
          cp "$MODJSON" out/sba-shaders/mod.json
          ls -la out/sba-shaders

      - uses: actions/upload-artifact@v4
        with:
          name: sba-shaders-run${{ github.run_number }}
          path: out/sba-shaders/
