name: Build sba-shaders

# Put sba-shaders.zip in the ROOT of the repository.
# Every push of that zip (or a manual run) builds the mod.
on:
  workflow_dispatch:
  push:
    paths:
      - 'sba-shaders.zip'
      - '.github/workflows/build-sba-shaders.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sba-shaders.zip
        run: |
          set -eu
          if [ ! -f sba-shaders.zip ]; then echo "::error::sba-shaders.zip not found in the repo root"; ls; exit 1; fi
          rm -rf work
          mkdir work
          unzip -q sba-shaders.zip -d work
          find work -type f

      - name: Compile libsba-shaders.so (arm64)
        run: |
          set -eu
          SRC=$(find work -name '*.cpp' | head -n1)
          MODJSON=$(find work -name mod.json | head -n1)
          if [ -z "$SRC" ]; then echo "::error::no .cpp file in the zip"; exit 1; fi
          if [ -z "$MODJSON" ]; then echo "::error::no mod.json in the zip"; exit 1; fi
          MODDIR=$(dirname "$MODJSON")
          HPP=$(find . -name bearite.hpp -not -path './.git/*' -not -path './work/*' | head -n1)
          if [ -z "$HPP" ]; then echo "::error::bearite.hpp not found in the repo"; exit 1; fi
          echo "commit: $GITHUB_SHA"
          echo "source: $SRC ($(wc -c < "$SRC") bytes)"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p out/sba-shaders
          "$CXX" -std=c++17 -O2 -shared -fPIC -fvisibility=hidden -static-libstdc++ \
            -Wl,-z,max-page-size=16384 \
            -I "$(dirname "$HPP")" "$SRC" \
            -o out/sba-shaders/libsba-shaders.so -ldl -llog
          nm -D --defined-only out/sba-shaders/libsba-shaders.so | grep -q bearite_on_load || { echo "::error::bearite_on_load is not exported"; exit 1; }
          cp "$MODJSON" out/sba-shaders/mod.json
          if [ -d "$MODDIR/shaderpacks" ]; then cp -r "$MODDIR/shaderpacks" out/sba-shaders/; fi
          ls -laR out/sba-shaders

      - uses: actions/upload-artifact@v4
        with:
          name: sba-shaders-run${{ github.run_number }}
          path: out/sba-shaders/
