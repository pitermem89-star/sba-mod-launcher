name: Build mod-menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile libmod-menu.so (arm64)
        run: |
          set -eu
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p out/mod-menu
          "$CXX" -std=c++17 -O2 -shared -fPIC -fvisibility=hidden -static-libstdc++ \
            -I api examples/mod-menu/src/mod_menu.cpp \
            -o out/mod-menu/libmod-menu.so -ldl -llog
          cp examples/mod-menu/mod.json out/mod-menu/mod.json
          ls -la out/mod-menu

      - uses: actions/upload-artifact@v7
        with:
          name: mod-menu
          path: out/mod-menu/
