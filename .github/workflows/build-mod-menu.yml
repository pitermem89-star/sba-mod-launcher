name: Build mod-menu

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/mod-menu/**'
      - '.github/workflows/build-mod-menu.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile libmod-menu.so (arm64)
        run: |
          set -eu
          SRC=examples/mod-menu/src/mod_menu.cpp
          MODJSON=examples/mod-menu/mod.json
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC not found"
            find . -not -path './.git/*' -name '*mod_menu*'
            exit 1
          fi
          if [ ! -f "$MODJSON" ]; then echo "::error::$MODJSON not found"; exit 1; fi
          HPP=$(find . -name bearite.hpp -not -path './.git/*' | head -n1)
          if [ -z "$HPP" ]; then echo "::error::bearite.hpp not found"; exit 1; fi
          echo "commit: $GITHUB_SHA"
          echo "source: $SRC ($(wc -c < "$SRC") bytes)"
          echo "other copies (should be empty):"
          find . -name 'mod_menu*' -not -path './.git/*' -not -path "./$SRC" || true
          grep -n "BUILD 3" "$SRC" || { echo "::error::source has no BUILD 3 marker"; exit 1; }
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p out/mod-menu
          "$CXX" -std=c++17 -O2 -shared -fPIC -fvisibility=hidden -static-libstdc++ \
            -I "$(dirname "$HPP")" "$SRC" \
            -o out/mod-menu/libmod-menu.so -ldl -llog
          strings out/mod-menu/libmod-menu.so | grep -q "BUILD 3" || { echo "::error::built .so has no BUILD 3"; exit 1; }
          cp "$MODJSON" out/mod-menu/mod.json
          ls -la out/mod-menu

      - uses: actions/upload-artifact@v4
        with:
          name: mod-menu-run${{ github.run_number }}
          path: out/mod-menu/
