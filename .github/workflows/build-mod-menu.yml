name: Build mod-menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile libmod-menu.so (arm64)
        run: |
          set -eu
          echo "all mod_menu.cpp copies:"; find . -name 'mod_menu*' -not -path './out/*' -not -path './.git/*'
          SRC=$(find . -path '*/src/mod_menu.cpp' -not -path './out/*' | head -n1)
          [ -n "$SRC" ] || SRC=$(find . -name mod_menu.cpp -not -path './out/*' | head -n1)
          HPP=$(find . -name bearite.hpp | head -n1)
          if [ -z "$SRC" ]; then echo "::error::mod_menu.cpp not found in the repo. Commit the mod-menu folder (src/mod_menu.cpp + mod.json)."; find . -maxdepth 3 -not -path './.git/*' | head -50; exit 1; fi
          if [ -z "$HPP" ]; then echo "::error::bearite.hpp not found in the repo"; exit 1; fi
          MODDIR=$(dirname "$(dirname "$SRC")")
          echo "source: $SRC"; echo "api: $HPP"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p out/mod-menu
          "$CXX" -std=c++17 -O2 -shared -fPIC -fvisibility=hidden -static-libstdc++ \
            -I "$(dirname "$HPP")" "$SRC" \
            -o out/mod-menu/libmod-menu.so -ldl -llog
          cp "$MODDIR/mod.json" out/mod-menu/mod.json
          ls -la out/mod-menu

      - uses: actions/upload-artifact@v7
        with:
          name: mod-menu
          path: out/mod-menu/
