name: Build Bearite Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android NDK
      run: |
        echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Create Android Build Structure
      run: |
        mkdir -p app/src/main/java/com/pitermem/bearite
        mkdir -p app/src/main/cpp
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        echo "include ':app'" > settings.gradle

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.pitermem.bearite'
            compileSdk 34
            defaultConfig {
                applicationId "com.pitermem.bearite"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                externalNativeBuild {
                    cmake { cppFlags "-std=c++17" }
                }
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            externalNativeBuild {
                cmake {
                    path "src/main/cpp/CMakeLists.txt"
                    version "3.22.1"
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com" package="com.pitermem.bearite">
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
            <application android:allowBackup="true" android:label="Bearite" android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity android:name=".LauncherActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
        cmake_minimum_required(VERSION 3.22.1)
        project("bearite_core")
        add_library(bearite_core SHARED native-lib.cpp)
        find_library(log-lib log)
        target_link_libraries(bearite_core ${log-lib})
        EOF

        cat << 'EOF' > app/src/main/java/com/pitermem/bearite/LauncherActivity.java
        package com.pitermem.bearite;
        import android.os.Bundle;
        import android.widget.Button;
        import androidx.appcompat.app.AppCompatActivity;
        public class LauncherActivity extends AppCompatActivity {
            static { System.loadLibrary("bearite_core"); }
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                Button btn = new Button(this);
                btn.setText("Bearite Launcher Started");
                setContentView(btn);
            }
        }
        EOF

        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        extern "C" JNIEXPORT jstring JNICALL
        Java_com_pitermem_bearite_LauncherActivity_stringFromJNI(JNIEnv* env, jobject thiz) {
            return env->NewStringUTF("Hello from Bearite Core");
        }
        EOF

    - name: Build Launcher APK
      run: |
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug

    - name: Upload Output APK
      uses: actions/upload-artifact@v4
      with:
        name: bearite-launcher-app
        path: app/build/outputs/apk/debug/app-debug.apk
        
