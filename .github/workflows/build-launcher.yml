name: Build launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on the runner), accept licenses
        working-directory: .
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check keystore is present
        run: |
          if [ ! -f app/src/main/assets/debug.keystore ]; then
            echo "::error::app/src/main/assets/debug.keystore is missing. Run the 'Generate debug keystore' workflow once first."
            exit 1
          fi

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # show the real errors as annotations (readable without downloading logs)
            grep -E "^e: |error:|What went wrong|Execution failed|Could not|FAILED" build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            tail -20 build.log
          fi
          exit $rc

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bearite-launcher
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
