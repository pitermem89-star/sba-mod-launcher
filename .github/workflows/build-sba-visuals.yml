name: Build SBA Visuals

on:
  workflow_dispatch:
  push:
    paths:
      - 'sba-visuals/**'
      - '.github/workflows/build-sba-visuals.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile libsba-visuals.so (arm64)
        run: |
          set -eu
          # find the files wherever they are (folder names may contain typos like "scr")
          SRC=$(find . -name sba_visuals.cpp -not -path './.git/*' | head -n1)
          if [ -z "$SRC" ]; then
            echo "::error::sba_visuals.cpp not found anywhere in the repo"
            find . -not -path './.git/*' -type f | head -n 80
            exit 1
          fi
          MODJSON=$(find . -name mod.json -path '*sba-visuals*' -not -path './.git/*' | head -n1)
          if [ -z "$MODJSON" ]; then
            echo "::error::mod.json for sba-visuals not found"
            find . -not -path './.git/*' -type f -path '*sba-visuals*'
            exit 1
          fi
          echo "using SRC=$SRC MODJSON=$MODJSON"
          EXPECT_BUILD="SBA-VISUALS 3"
          HPP=$(find . -name bearite.hpp -not -path './.git/*' | head -n1)
          if [ -z "$HPP" ]; then echo "::error::bearite.hpp not found"; exit 1; fi
          echo "commit: $GITHUB_SHA"
          echo "source: $SRC ($(wc -c < "$SRC") bytes)"
          echo "other copies (should be empty):"
          find . -name 'sba_visuals*' -not -path './.git/*' -not -path "$SRC" || true
          grep -n "$EXPECT_BUILD" "$SRC" || { echo "::error::source has no '$EXPECT_BUILD' marker (old file?)"; exit 1; }
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p out/sba-visuals
          "$CXX" -std=c++17 -O2 -shared -fPIC -fvisibility=hidden -static-libstdc++ \
            -Wl,-z,max-page-size=16384 \
            -I "$(dirname "$HPP")" "$SRC" \
            -o out/sba-visuals/libsba-visuals.so -ldl -llog
          strings out/sba-visuals/libsba-visuals.so | grep -q "$EXPECT_BUILD" || { echo "::error::built .so has no '$EXPECT_BUILD'"; exit 1; }
          nm -D --defined-only out/sba-visuals/libsba-visuals.so | grep -q bearite_on_load || { echo "::error::bearite_on_load is not exported"; exit 1; }
          cp "$MODJSON" out/sba-visuals/mod.json
          ls -la out/sba-visuals

      - uses: actions/upload-artifact@v4
        with:
          name: sba-visuals-run${{ github.run_number }}
          path: out/sba-visuals/
