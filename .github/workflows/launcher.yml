name: Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build native libs
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          for name in loader proxy; do
            cmake -S $name -B build/$name \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$name -j"$(nproc)"
          done
          ASSETS=launcher/app/src/main/assets
          mkdir -p $ASSETS
          cp build/loader/libbearite.so $ASSETS/
          cp build/proxy/libmain.so $ASSETS/
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded $ASSETS/libbearite.so $ASSETS/libmain.so
          ls -l $ASSETS

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build launcher
        working-directory: launcher
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bearite-launcher
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
