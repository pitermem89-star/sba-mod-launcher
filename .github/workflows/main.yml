name: Patch APK

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1 --repo ${{ github.repository }} --dir apks --pattern "*.apk"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -o cmdline-tools.zip -d cmdline-tools
          yes | cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$PWD/android-sdk "build-tools;34.0.0"

      - name: Generate key
        run: keytool -genkeypair -keystore my-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass 123456 -keypass 123456 -dname "CN=sba"

      - name: Align and sign
        run: |
          mkdir -p signed
          for f in apks/*.apk; do n=$(basename "$f"); $PWD/android-sdk/build-tools/34.0.0/zipalign -f -p 4 "$f" "aligned-$n"; $PWD/android-sdk/build-tools/34.0.0/apksigner sign --ks my-key.jks --ks-pass pass:123456 --key-pass pass:123456 --out "signed/$n" "aligned-$n"; done
          ls -la signed
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: signed/*.apk
