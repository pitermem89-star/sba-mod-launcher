name: Inspect ExecuteProgram call sites

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag with libil2cpp.so"
        default: "natives-1"
      asset:
        description: "Asset name"
        default: "libil2cpp.so"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download libil2cpp.so
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          mkdir -p in
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir in --clobber

      - name: Install AArch64 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu python3-pip
          pip install --quiet capstone

      - name: Find ExecuteProgram call sites
        run: |
          python3 - <<'PYEOF'
          import subprocess
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          from capstone.arm64_const import ARM64_OP_IMM, ARM64_OP_MEM, ARM64_OP_REG

          path = "in/libil2cpp.so"
          def sh(cmd): return subprocess.check_output(cmd, shell=True, text=True)

          rela = sh(f"aarch64-linux-gnu-readelf -rW {path} 2>/dev/null | grep JUMP_SLOT")
          lines = rela.strip().split("\n")
          idx = next(i for i, l in enumerate(lines) if "ExecuteProgram" in l)
          got_slot = int(lines[idx].split()[0], 16)
          print(f"ExecuteProgram GOT slot address: {hex(got_slot)}")

          sec = sh(f"aarch64-linux-gnu-readelf -SW {path}")
          sections = []
          for line in sec.split("\n"):
              toks = line.split()
              if len(toks) >= 8 and toks[0].startswith("[") and toks[2] == "PROGBITS":
                  name, addr, off, size, flags = toks[1], toks[3], toks[4], toks[5], toks[7]
                  size_i = int(size, 16)
                  if "X" in flags and size_i > 500_000:
                      sections.append((name, int(addr, 16), int(off, 16), size_i))

          print("Executable sections to scan:")
          for name, addr, off, size in sections:
              print(f"  {name}: addr={hex(addr)} size={hex(size)} ({size/1024/1024:.1f} MB)")
          print()

          data = open(path, "rb").read()
          md = Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          md.detail = True

          def scan(name, addr, off, size):
              buf = data[off:off+size]
              insns = list(md.disasm(buf, addr))
              addrs_sorted = [i.address for i in insns]
              by_addr = {i.address: i for i in insns}

              hits = []
              for i, insn in enumerate(insns):
                  if insn.mnemonic != "adrp" or len(insn.operands) < 2:
                      continue
                  rd = insn.operands[0].reg
                  page = insn.operands[1].imm
                  for j in range(i + 1, min(i + 6, len(insns))):
                      nxt = insns[j]
                      if nxt.mnemonic != "ldr" or len(nxt.operands) < 2:
                          continue
                      mem = nxt.operands[1]
                      if mem.type != ARM64_OP_MEM or mem.mem.base != rd or mem.mem.index != 0:
                          continue
                      eff = page + mem.mem.disp
                      if eff != got_slot:
                          break
                      dest_reg = nxt.operands[0].reg
                      for k in range(j + 1, min(j + 6, len(insns))):
                          br = insns[k]
                          if br.mnemonic in ("blr", "br") and br.operands and br.operands[0].reg == dest_reg:
                              hits.append(insn.address)
                              break
                      break

              print(f"{name}: {len(hits)} call site(s)")
              for addr2 in hits[:10]:
                  lo = max(addr, addr2 - 10 * 4)
                  hi = addr2 + 15 * 4
                  print(f"=== around {hex(addr2)} (in {name}) ===")
                  for a in addrs_sorted:
                      if lo <= a <= hi:
                          ins = by_addr[a]
                          print(f"  {hex(a)}: {ins.mnemonic} {ins.op_str}")
                  print()
              return hits

          total = []
          for name, addr, off, size in sections:
              total += scan(name, addr, off, size)

          print(f"TOTAL call sites found: {len(total)}")

          if total == 0:
              print("\nFallback: dumping raw bytes of the GOT slot area for manual inspection.")
              sec2 = sh(f"aarch64-linux-gnu-readelf -SW {path}")
              for line in sec2.split("\n"):
                  toks = line.split()
                  if len(toks) >= 6 and toks[0].startswith("[") and toks[2] == "PROGBITS":
                      try:
                          a, o, s = int(toks[3], 16), int(toks[4], 16), int(toks[5], 16)
                      except Exception:
                          continue
                      if a <= got_slot < a + s:
                          print(f"GOT slot lives in section {toks[1]} ({hex(a)}..{hex(a+s)})")
          PYEOF

      - name: Upload summary
        if: always()
        run: echo "See the step log above for call sites."
