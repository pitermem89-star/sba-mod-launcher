name: Inspect ExecuteProgram call sites

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag with libil2cpp.so"
        default: "natives-1"
      asset:
        description: "Asset name"
        default: "libil2cpp.so"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download libil2cpp.so
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          mkdir -p in
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir in --clobber

      - name: Install AArch64 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu python3-pip
          pip install --quiet capstone

      - name: Find ExecuteProgram call sites
        run: |
          python3 - <<'PYEOF'
          import struct, subprocess
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          from capstone.arm64_const import ARM64_OP_MEM

          path = "in/libil2cpp.so"
          def sh(cmd): return subprocess.check_output(cmd, shell=True, text=True)

          rela = sh(f"aarch64-linux-gnu-readelf -rW {path} 2>/dev/null | grep JUMP_SLOT")
          lines = rela.strip().split("\n")
          idx = next(i for i, l in enumerate(lines) if "ExecuteProgram" in l)
          got_slot = int(lines[idx].split()[0], 16)
          print(f"ExecuteProgram GOT slot address: {hex(got_slot)}")
          got_page = got_slot & ~0xFFF
          print(f"GOT slot page: {hex(got_page)} (page offset {hex(got_slot - got_page)})")

          sec = sh(f"aarch64-linux-gnu-readelf -SW {path}")
          sections = []
          for line in sec.split("\n"):
              toks = line.split()
              if len(toks) >= 8 and toks[0].startswith("[") and toks[2] == "PROGBITS":
                  name, addr, off, size, flags = toks[1], toks[3], toks[4], toks[5], toks[7]
                  size_i = int(size, 16)
                  if "X" in flags and size_i > 500_000:
                      sections.append((name, int(addr, 16), int(off, 16), size_i))

          print("Executable sections to scan:")
          for name, addr, off, size in sections:
              print(f"  {name}: addr={hex(addr)} size={hex(size)} ({size/1024/1024:.1f} MB)")
          print()

          data = open(path, "rb").read()

          # --- Fast raw-bytes pass: decode ADRP encoding directly, no disassembler. ---
          # ADRP: bit31=op(1) bits30-29=immlo bits28-24=10000 bits23-5=immhi(19) bits4-0=Rd
          def sign21(v):
              return v - (1 << 21) if v & (1 << 20) else v

          candidates = []  # (abs_address, Rd)
          for name, addr, off, size in sections:
              n_words = size // 4
              words = struct.unpack(f"<{n_words}I", data[off:off + n_words*4])
              for i, w in enumerate(words):
                  if (w >> 31) & 1 != 1:
                      continue
                  if (w >> 24) & 0x1F != 0b10000:
                      continue
                  immlo = (w >> 29) & 0b11
                  immhi = (w >> 5) & 0x7FFFF
                  imm21 = sign21((immhi << 2) | immlo)
                  this_addr = addr + i * 4
                  page = (this_addr & ~0xFFF) + (imm21 << 12)
                  if page == got_page:
                      rd = w & 0x1F
                      candidates.append((this_addr, rd, name, addr, off, size))

          print(f"ADRP candidates pointing at the GOT slot's page: {len(candidates)}\n")

          # --- For each candidate, disassemble a small window with Capstone to
          # confirm the LDR uses the right offset and is followed by blr/br. ---
          md = Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          md.detail = True
          hits = []
          for this_addr, rd, name, sec_addr, sec_off, sec_size in candidates:
              local = this_addr - sec_addr
              window = data[sec_off + local: sec_off + local + 6*4]
              insns = list(md.disasm(window, this_addr))
              if not insns:
                  continue
              for j in range(1, len(insns)):
                  nxt = insns[j]
                  if nxt.mnemonic != "ldr" or len(nxt.operands) < 2:
                      continue
                  mem = nxt.operands[1]
                  if mem.type != ARM64_OP_MEM or mem.mem.base != rd or mem.mem.index != 0:
                      continue
                  if mem.mem.disp != (got_slot - got_page):
                      continue
                  dest_reg = nxt.operands[0].reg
                  for k in range(j+1, min(j+6, len(insns))):
                      br = insns[k]
                      if br.mnemonic in ("blr", "br") and br.operands and br.operands[0].reg == dest_reg:
                          hits.append((this_addr, name))
                          break
                  break

          print(f"Confirmed call sites: {len(hits)}\n")
          for this_addr, name in hits[:10]:
              sec_addr, sec_off, sec_size = next((a,o,s) for n,a,o,s in [(n,a,o,s) for n,a,o,s in [(x[2],x[3],x[4],x[5]) for x in candidates if x[0]==this_addr]][:1])
              local = this_addr - sec_addr
              lo = max(0, local - 10*4)
              window = data[sec_off+lo: sec_off+local+15*4]
              print(f"=== around {hex(this_addr)} (in {name}) ===")
              for insn in md.disasm(window, sec_addr+lo):
                  marker = "  <-- adrp" if insn.address == this_addr else ""
                  print(f"  {hex(insn.address)}: {insn.mnemonic} {insn.op_str}{marker}")
              print()

          print(f"TOTAL confirmed call sites: {len(hits)}")
          PYEOF

      - name: Upload summary
        if: always()
        run: echo "See the step log above for call sites."
