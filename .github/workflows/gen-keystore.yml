name: Generate debug keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate keystore (Android-compatible PKCS12)
        run: |
          mkdir -p launcher/app/src/main/assets
          rm -f launcher/app/src/main/assets/debug.keystore
          keytool -genkeypair -v \
            -keystore launcher/app/src/main/assets/debug.keystore \
            -storetype PKCS12 \
            -J-Dkeystore.pkcs12.certProtectionAlgorithm=PBEWithSHA1AndRC2_40 \
            -J-Dkeystore.pkcs12.keyProtectionAlgorithm=PBEWithSHA1AndDESede \
            -J-Dkeystore.pkcs12.macAlgorithm=HmacPBESHA1 \
            -alias bearite \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bearite123 -keypass bearite123 \
            -dname "CN=Bearite, OU=Bearite, O=Bearite, L=NA, S=NA, C=NA"
      - name: Verify it readable with legacy algorithms
        run: |
          keytool -list -v -keystore launcher/app/src/main/assets/debug.keystore -storepass bearite123 | head -20
      - name: Commit keystore
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f launcher/app/src/main/assets/debug.keystore
          git commit -m "Regenerate launcher keystore with Android-compatible PKCS12 algorithms" || echo "Nothing to commit"
          git push
