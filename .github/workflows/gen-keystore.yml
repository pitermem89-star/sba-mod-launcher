name: Generate debug keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate keystore
        run: |
          mkdir -p launcher/app/src/main/assets
          keytool -genkeypair -v \
            -keystore launcher/app/src/main/assets/debug.keystore \
            -storetype PKCS12 \
            -alias bearite \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bearite123 -keypass bearite123 \
            -dname "CN=Bearite, OU=Bearite, O=Bearite, L=NA, S=NA, C=NA"
      - name: Commit keystore
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add launcher/app/src/main/assets/debug.keystore
          git commit -m "Add launcher signing keystore" || echo "Nothing to commit"
          git push
