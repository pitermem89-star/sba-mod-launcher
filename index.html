<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA Mod Launcher</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1f22; 
            font-family: system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-section {
            flex: 1; 
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        /* Левая серая панель */
        .sidebar {
            width: 75px;
            background-color: #2b2d31; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            gap: 15px;
            border-right: 1px solid #1e1f22;
        }

        /* Серые квадратные кнопки */
        .tab-btn {
            width: 55px;
            height: 55px;
            background-color: #313338;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; 
            overflow: hidden;
        }

        .tab-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .tab-btn:active, .tab-btn.active {
            background-color: #3c3f45; 
        }

        /* Рабочая область */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            color: #dbdee1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Блок, куда будут красиво вставать онлайн-новости */
        .news-box {
            background-color: #2b2d31;
            border: 1px solid #3f4248;
            border-radius: 8px;
            padding: 15px;
            white-space: pre-wrap; /* Чтобы текст сохранял абзацы как в файле */
            line-height: 1.5;
            font-size: 15px;
        }

        /* Нижняя панель */
        .bottom-bar {
            height: 70px;
            background-color: #2b2d31; 
            border-top: 1px solid #1e1f22;
            display: flex;
            align-items: center;
            justify-content: flex-end; 
            padding-right: 20px;
            box-sizing: border-box;
        }

        .play-btn {
            background-color: #1e1f22;
            color: #ffffff;
            border: 1px solid #3f4248;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: lowercase; 
        }

        .play-btn:active {
            background-color: #2b2d31;
        }

        h2 { margin-top: 0; font-weight: 500; text-transform: lowercase; }
    </style>
</head>
<body>

    <div class="top-section">
        
        <div class="sidebar">
            <button class="tab-btn active" onclick="switchTab('news', this)">
                <img src="assets/home.png" alt="🏠">
            </button>
            <button class="tab-btn" onclick="switchTab('mods', this)">
                <img src="assets/mods.png" alt="🧩">
            </button>
            <button class="tab-btn" onclick="switchTab('textures', this)">
                <img src="assets/textures.png" alt="🖼️">
            </button>
            <button class="tab-btn" onclick="switchTab('settings', this)">
                <img src="assets/settings.png" alt="⚙️">
            </button>
        </div>

        <div class="content-area">
            <!-- ВКЛАДКА НОВОСТЕЙ -->
            <div id="news" class="tab-content active">
                <h2>новости</h2>
                <!-- Сюда наш шпион вставит текст из интернета -->
                <div class="news-box" id="load-news">Загрузка свежих новостей...</div>
            </div>
            
            <div id="mods" class="tab-content">
                <h2>моды</h2>
                <p>Список доступных модификаций в стиле Genshin.</p>
            </div>
            
            <div id="textures" class="tab-content">
                <h2>текстур паки</h2>
                <p>Выбор графики и скинов.</p>
            </div>
            
            <div id="settings" class="tab-content">
                <h2>настройки</h2>
                <p>Параметры приложения.</p>
            </div>
        </div>

    </div>

    <div class="bottom-bar">
        <button class="play-btn">играть</button>
    </div>

    <script>
        // Функция переключения вкладок
        function switchTab(tabId, button) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            button.classList.add('active');
        }

        // Функция-шпион, которая летит на GitHub за новостями
        async function loadOnlineNews() {
            // Ссылка на твой файл news.txt на GitHub
            const url = "https://githubusercontent.com";
            const newsBox = document.getElementById("load-news");

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Не удалось загрузить");
                const text = await response.text();
                
                // Вставляем скачанный текст вместо надписи "Загрузка..."
                newsBox.innerText = text;
            } catch (error) {
                // Если нет интернета, покажем красивую ошибку
                newsBox.innerText = "❌ Не удалось обновить новости. Проверь подключение к интернету!";
            }
        }

        // Запускаем шпиона сразу, как только приложение включилось
        window.onload = loadOnlineNews;
    </script>
</body>
</html>
