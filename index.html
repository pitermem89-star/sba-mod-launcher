<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBA Mod Launcher</title>
    <style>
        /* Настройки экрана под твой рисунок */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1f22; /* Серый фон главного экрана */
            font-family: system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Верхняя зона приложения */
        .top-section {
            flex: 1; 
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        /* Левая серая панель из твоего рисунка */
        .sidebar {
            width: 75px;
            background-color: #2b2d31; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            gap: 15px;
            border-right: 1px solid #1e1f22;
        }

        /* Квадратные серые кнопки */
        .tab-btn {
            width: 55px;
            height: 55px;
            background-color: #313338;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; 
            overflow: hidden;
        }

        /* Твои картинки внутри кнопок */
        .tab-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .tab-btn:active, .tab-btn.active {
            background-color: #3c3f45; 
        }

        /* Пустое место для вкладок */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            color: #dbdee1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Твоя нижняя серая панель */
        .bottom-bar {
            height: 70px;
            background-color: #2b2d31; 
            border-top: 1px solid #1e1f22;
            display: flex;
            align-items: center;
            justify-content: flex-end; 
            padding-right: 20px;
            box-sizing: border-box;
        }

        /* Кнопка играть из твоего макета */
        .play-btn {
            background-color: #1e1f22;
            color: #ffffff;
            border: 1px solid #3f4248;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: lowercase; 
        }

        .play-btn:active {
            background-color: #2b2d31;
        }

        h2 { margin-top: 0; font-weight: 500; text-transform: lowercase; }
    </style>
</head>
<body>

    <div class="top-section">
        
        <!-- Меню теперь ищет картинки локально в папке assets -->
        <div class="sidebar">
            <button class="tab-btn active" onclick="switchTab('news', this)">
                <img src="assets/home.png" alt="">
            </button>
            <button class="tab-btn" onclick="switchTab('mods', this)">
                <img src="assets/mods.png" alt="">
            </button>
            <button class="tab-btn" onclick="switchTab('textures', this)">
                <img src="assets/textures.png" alt="">
            </button>
            <button class="tab-btn" onclick="switchTab('settings', this)">
                <img src="assets/settings.png" alt="">
            </button>
        </div>

        <!-- Центральное пустое место, где меняется текст при нажатии на кнопки -->
        <div class="content-area">
            <div id="news" class="tab-content active">
                <h2>новости</h2>
                <p>Здесь будут выводиться главные новости нашего лаунчера.</p>
            </div>
            <div id="mods" class="tab-content">
                <h2>моды</h2>
                <p>Список доступных модификаций в стиле Genshin.</p>
            </div>
            <div id="textures" class="tab-content">
                <h2>текстур паки</h2>
                <p>Выбор графики и скинов.</p>
            </div>
            <div id="settings" class="tab-content">
                <h2>настройки</h2>
                <p>Параметры приложения.</p>
            </div>
        </div>

    </div>

    <div class="bottom-bar">
        <button class="play-btn">играть</button>
    </div>

    <!-- Логика переключения кнопок -->
    <script>
        function switchTab(tabId, button) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            button.classList.add('active');
        }
    </script>
</body>
      </html>
